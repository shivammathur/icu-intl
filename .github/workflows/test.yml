name: 'Test workflow'
on:
  workflow_dispatch:
    inputs:
      icu:
        description: ICU version (leave empty to test all versions)
        required: false
      skip_x86_64:
        description: skip x86_64 builds
        required: false
      skip_aarch64:
        description: skip aarch64 builds
        required: false
jobs:
  intl_x86_64:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        icu: ${{ fromJSON(inputs.icu && format('[{0}]', inputs.icu) || '[79.1, 78.3, 78.2, 78.1, 77.1, 76.1, 75.1, 74.2, 74.1, 73.2, 73.1, 72.1, 71.1, 70.1, 69.1, 68.2, 68.1, 67.1, 66.1, 65.1, 64.2, 63.2, 62.2, 61.2, 60.3, 59.2, 58.3, 57.2]') }}
        ts: ['ts', 'nts']
    if: "!contains(inputs.skip_x86_64, 'true')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP 5.6
        uses: shivammathur/setup-php@develop
        with:
          php-version: 5.6
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 7.0
        uses: shivammathur/setup-php@develop
        with:
          php-version: 7.0
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 7.1
        uses: shivammathur/setup-php@develop
        with:
          php-version: 7.1
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 7.2
        uses: shivammathur/setup-php@develop
        with:
          php-version: 7.2
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 7.3
        uses: shivammathur/setup-php@develop
        with:
          php-version: 7.3
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@develop
        with:
          php-version: 7.4
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.0
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.1
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.2
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.3
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.4
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.5
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Testing ICU version
        run: |
          icu="${{ matrix.icu }}"
          icu_major=${icu%%.*}
          for v in 5.6 7.0 7.1 7.2 7.3 7.4 8.0 8.1 8.2 8.3 8.4 8.5; do
            if [ "$v" = "8.5" ] && [ "$icu_major" -lt 57 ]; then
              echo "Skipping php$v for ICU $icu"
              continue
            fi
            icu_version=$(php$v -i | grep "ICU version =>" | sed -e "s|.*=> s*||")
            echo php$v: $icu_version
            if [ "$icu_version" != "${{ matrix.icu }}" ]; then
              echo "::error::failed to setup ${{ matrix.icu }} on php $v"
              exit 1
            fi
            php$v -r 'if (Normalizer::normalize("e\xCC\x81") !== "\xC3\xA9" || collator_compare(collator_create("en_US"), "a", "b") >= 0) { exit(1); }'
            php$v -v
          done
  intl_aarch64:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm, ubuntu-24.04-arm]
        icu: ${{ fromJSON(inputs.icu && format('[{0}]', inputs.icu) || '[79.1, 78.3, 78.2, 78.1, 77.1, 76.1, 75.1, 74.2, 74.1, 73.2, 73.1, 72.1, 71.1, 70.1, 69.1, 68.2, 68.1, 67.1, 66.1, 65.1, 64.2, 63.2, 62.2, 61.2, 60.3, 59.2, 58.3, 57.2]') }}
        ts: ['ts', 'nts']
    if: "!contains(inputs.skip_aarch64, 'true')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP 5.6
        uses: shivammathur/setup-php@develop
        with:
          php-version: 5.6
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 7.0
        uses: shivammathur/setup-php@develop
        with:
          php-version: 7.0
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 7.1
        uses: shivammathur/setup-php@develop
        with:
          php-version: 7.1
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 7.2
        uses: shivammathur/setup-php@develop
        with:
          php-version: 7.2
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 7.3
        uses: shivammathur/setup-php@develop
        with:
          php-version: 7.3
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@develop
        with:
          php-version: 7.4
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.0
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.1
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.2
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.3
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.4
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@develop
        with:
          php-version: 8.5
          extensions: intl-${{ matrix.icu }}
        env:
          phpts: ${{ matrix.ts }}
      - name: Testing ICU version
        run: |
          icu="${{ matrix.icu }}"
          icu_major=${icu%%.*}
          for v in 5.6 7.0 7.1 7.2 7.3 7.4 8.0 8.1 8.2 8.3 8.4 8.5; do
            if [ "$v" = "8.5" ] && [ "$icu_major" -lt 57 ]; then
              echo "Skipping php$v for ICU $icu"
              continue
            fi
            icu_version=$(php$v -i | grep "ICU version =>" | sed -e "s|.*=> s*||")
            echo php$v: $icu_version
            if [ "$icu_version" != "${{ matrix.icu }}" ]; then
              echo "::error::failed to setup ${{ matrix.icu }} on php $v"
              exit 1
            fi
            php$v -r 'if (Normalizer::normalize("e\xCC\x81") !== "\xC3\xA9" || collator_compare(collator_create("en_US"), "a", "b") >= 0) { exit(1); }'
            php$v -v
          done
